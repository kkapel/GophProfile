{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gophprofile.secretName" . }}
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.dependencies.enabled }}
  # Зависимости разворачивает сам чарт, поэтому адреса собираются
  # из имени релиза.
  GOPHPROFILE_DATABASE_URL: "postgres://{{ .Values.dependencies.postgres.user }}:{{ .Values.dependencies.postgres.password }}@{{ include "gophprofile.fullname" . }}-postgres:5432/{{ .Values.dependencies.postgres.database }}?sslmode=disable"
  GOPHPROFILE_MINIO_ACCESS_KEY: {{ .Values.dependencies.minio.rootUser | quote }}
  GOPHPROFILE_MINIO_SECRET_KEY: {{ .Values.dependencies.minio.rootPassword | quote }}
  GOPHPROFILE_RABBITMQ_URL: "amqp://{{ .Values.dependencies.rabbitmq.user }}:{{ .Values.dependencies.rabbitmq.password }}@{{ include "gophprofile.fullname" . }}-rabbitmq:5672/"
  {{- else }}
  # Внешние сервисы: адреса задаются в values.
  GOPHPROFILE_DATABASE_URL: {{ .Values.secrets.databaseURL | quote }}
  GOPHPROFILE_MINIO_ACCESS_KEY: {{ .Values.secrets.minioAccessKey | quote }}
  GOPHPROFILE_MINIO_SECRET_KEY: {{ .Values.secrets.minioSecretKey | quote }}
  GOPHPROFILE_RABBITMQ_URL: {{ .Values.secrets.rabbitmqURL | quote }}
  {{- end }}
{{- end }}