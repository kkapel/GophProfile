global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: gophprofile-server
    static_configs:
      - targets: ["server:8080"]

  - job_name: gophprofile-worker
    static_configs:
      - targets: ["worker:8081"]