<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Галерея — {{.UserID}}</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900">
  <div class="container mx-auto px-4 py-8 max-w-4xl">
    <div class="bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl border border-white/20 overflow-hidden">
      <header class="bg-gradient-to-r from-purple-600 to-blue-600 p-6">
        <h1 class="text-3xl font-bold text-white text-center">Галерея</h1>
        <p class="text-white/80 text-center mt-2">{{.UserID}}</p>
      </header>

      <main class="p-6">
        <a href="/web/upload" class="inline-block mb-6 text-white/80 hover:text-white text-sm">← загрузить ещё</a>

        {{if not .Avatars}}
        <p class="text-white/60 text-center py-12">У пользователя пока нет аватарок.</p>
        {{else}}
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
          {{range .Avatars}}
          <div class="bg-white/5 border border-white/10 rounded-xl p-3 space-y-2">
            <img src="/api/v1/avatars/{{.ID}}?size=300x300" alt="аватарка"
              class="w-full aspect-square object-cover rounded-lg bg-black/20">
            <p class="text-white/70 text-xs truncate" title="{{.FileName}}">{{.FileName}}</p>
            <div class="flex items-center justify-between">
              <span class="text-xs px-2 py-0.5 rounded-full
                {{if eq .Status "completed"}}bg-green-500/20 text-green-200
                {{else if eq .Status "failed"}}bg-red-500/20 text-red-200
                {{else}}bg-blue-500/20 text-blue-200{{end}}">{{.Status}}</span>
              <a href="/api/v1/avatars/{{.ID}}/metadata" target="_blank"
                class="text-white/50 hover:text-white text-xs">метаданные</a>
            </div>
          </div>
          {{end}}
        </div>
        {{end}}
      </main>
    </div>
  </div>
</body>
</html>
