apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gophprofile-server
  namespace: gophprofile
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gophprofile-server
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      # Реагируем на рост быстро.
      stabilizationWindowSeconds: 30
    scaleDown:
      # А сворачиваемся неспешно, чтобы не дёргать поды на всплесках.
      stabilizationWindowSeconds: 300