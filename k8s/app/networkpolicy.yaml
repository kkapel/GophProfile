# По умолчанию весь трафик в namespace запрещён.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: gophprofile
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Разрешения для сервера.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gophprofile-server
  namespace: gophprofile
spec:
  podSelector:
    matchLabels:
      app: gophprofile-server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Пользовательский трафик приходит только через ingress-контроллер.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080
  egress:
    # DNS: без него не разрешатся имена postgres, minio, rabbitmq.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Зависимости внутри своего namespace.
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: minio
      ports:
        - port: 9000
    - to:
        - podSelector:
            matchLabels:
              app: rabbitmq
      ports:
        - port: 5672
---
# Разрешения для воркера: наружу его никто не зовёт, кроме Prometheus.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gophprofile-worker
  namespace: gophprofile
spec:
  podSelector:
    matchLabels:
      app: gophprofile-worker
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8081
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: minio
      ports:
        - port: 9000
    - to:
        - podSelector:
            matchLabels:
              app: rabbitmq
      ports:
        - port: 5672
---
# Зависимости принимают трафик только от приложения.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dependencies
  namespace: gophprofile
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [postgres, minio, rabbitmq]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gophprofile-server
        - podSelector:
            matchLabels:
              app: gophprofile-worker